name: checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            shellcheck ncbi-blast+ bedtools r-base-core r-cran-data.table r-cran-ggplot2
          pip install --quiet biopython

      - name: Line endings (no Windows CRLF)
        run: |
          if grep -rIl $'\r' --include='*.sh' --include='*.py' --include='*.R' .; then
            echo "Files above have Windows line endings; convert with dos2unix."; exit 1
          fi

      - name: Bash syntax + shellcheck
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          shellcheck -S warning $(git ls-files '*.sh')

      - name: Python syntax
        run: python -m py_compile $(git ls-files '*.py')

      - name: R syntax
        run: for f in $(git ls-files '*.R'); do Rscript -e "invisible(parse('$f'))"; done

      - name: Test - LTR age pipeline (simulated genome)
        run: bash tests/ltr_age/run_test.sh

      - name: Test - pan-RGAome (simulated clusters)
        run: bash tests/pan_rgaome/run_test.sh
