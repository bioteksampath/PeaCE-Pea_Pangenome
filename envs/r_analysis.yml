name: pisum_r
# Versions as reported in the manuscript Methods; unpinned tools were not versioned there.
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.3
  - r-data.table
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-readr
  - r-pheatmap
  - r-ggrepel
  - r-openxlsx
  - bioconductor-deseq2      # v1.52.0 used in the paper
  - bioconductor-tximport
